spring.application.name=secure-file-sharing
server.port=8888

spring.datasource.url=jdbc:mysql://localhost:3306/file_sharing_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456}
app.jwt.expiration-ms=900000

app.file.storage-dir=uploads
app.file.max-size-bytes=10485760